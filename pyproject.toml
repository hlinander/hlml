[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equivariant-posteriors"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "black>=25.1.0",
    "boto3>=1.40.55",
    "cdsapi>=0.7.5",
    "datasets>=2.2.1",
    "dill>=0.3.9",
    "duckdb==1.5.2",
    "einops>=0.8.1",
    "feed-python",
    "filelock>=3.17.0",
    "gitpython>=3.1.44",
    "healpix>=2024.2",
    "ipdb>=0.13.13",
    "ipython>=8.32.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.0",
    "numpy>=2.2.2",
    "peft>=0.14.0",
    "plotext==5.2.8",
    "psycopg>=3.2.4",
    "pytest>=8.3.4",
    "python-lsp-ruff>=2.2.2",
    "rplot>=1.8",
    "ruff>=0.9.6",
    "seaborn>=0.13.2",
    "timm>=1.0.14",
    "torch==2.5.1",
    "torchmetrics>=1.6.1",
    "tqdm>=4.67.1",
    "transformers>=4.48.3",
    "xarray>=2025.1.2",
    "pynvml>=11.0.0",
    "nvidia-physicsnemo>=1.3.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.15.1",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.2",
    "torch-geometric>=2.7.0",
    "cfgrib>=0.9.15.1",
    "seaborn-image>=0.10.0",
    "segmentation-models-pytorch>=0.5.0",
    "dask>=2026.3.0",
    "healpy>=1.19.0",
]

[project.optional-dependencies]
graphcast = [
    "torch-scatter==2.1.2",
]
test = [
    "moto[server]>=5.0.0",
]
feed = []  # Compatibility with existing uv --extra feed commands.

[tool.uv.sources]
feed-python = { git = "ssh://git@github.com/linstromcloud-clients/feed-client.git", subdirectory = "python" }

[[tool.uv.index]]
name = "pyg-wheels"
url = "https://data.pyg.org/whl/torch-2.5.1+cu124.html"
format = "flat"

[tool.hatch.build.targets.wheel]
packages = ["lib", "experiments"]

[tool.pytest.ini_options]
addopts = [
    # Allow test files to have the same name in different directories.
    "--import-mode=importlib",
]
